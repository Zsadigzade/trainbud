# Dependency updates as pull requests.
#
# This exists because the 2026-09-07 dependency sweep was done by hand, and the
# thing it found could not have been found by reading a version number: the
# native SQLite dependency publishes no prebuilt binary below Node 22, so the
# advertised floor was one that no Windows user could install on. A weekly PR
# would not have diagnosed that, but it would have put the upgrade in front of
# CI -- which is where it was eventually caught, once CI ran on Windows.
#
# Grouped on purpose. Ten separate patch PRs a week is how a bot gets muted.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR. If CI is green on all four
      # platforms, it is one review rather than ten.
      routine:
        update-types:
          - minor
          - patch
      # Majors stay separate: each one deserves its own argument, and the two
      # that mattered here (TypeScript 7, better-sqlite3 13) were both reverted
      # after a real problem showed up that the version number did not.
      major:
        update-types:
          - major
    ignore:
      # TypeScript 7 was adopted and reverted on 2026-09-07: typescript-eslint
      # has no TS 7 support, so taking it trades a working lint for a faster
      # build. Dependabot cannot know that, and its first run failed twice
      # resolving the peer dependency. This is the decision written down where
      # the bot can read it. Remove the entry when typescript-eslint ships TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # better-sqlite3 13 was adopted and reverted on 2026-09-08. It ships
      # binaries inside the tarball, so a local npm install on Windows needs no
      # compiler and looks like proof -- but under `npm ci` in a clean checkout,
      # the path CI, contributors and releases all take, it still falls through
      # to node-gyp and fails with no Visual Studio installation. Dependabot
      # opened exactly this PR on its first run. Remove when 13.x installs under
      # npm ci on windows-latest.
      - dependency-name: better-sqlite3
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The image runs the Node this package says it supports, and a test pins
      # both Dockerfile stages to engines.node. Bumping the base alone fails
      # four jobs with "a Dockerfile stage is on a different Node" -- which is
      # the guard working, not a problem to route around. Moving the image means
      # moving the floor, which is a deliberate change with its own argument.
      - dependency-name: node
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
