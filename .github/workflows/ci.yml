name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # The README promises Windows, macOS and Linux, and only Linux was ever
    # checked. This project is developed on Windows, where the paths, the line
    # endings and the native better-sqlite3 build all behave differently -- the
    # exact places a cross-platform claim goes wrong without anyone noticing.
    #
    # The full matrix on every platform would be six jobs for little more
    # signal, so the other two run the supported floor, Node 22.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24]
        include:
          - os: windows-latest
            node-version: 22
          - os: macos-latest
            node-version: 22

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  # The README and the launch copy both offer a Docker image, and nothing ever
  # built it. An image that does not build is a worse promise than no image.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t trainbud:ci .

      # Proves the entrypoint resolves and the native module loaded, which is the
      # part that breaks when the base image moves.
      - name: Run the CLI inside it
        run: docker run --rm --entrypoint node trainbud:ci dist/index.js --version
